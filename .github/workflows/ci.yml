name: PettyFlow CI/CD Pipeline

on:
  push:
    branches: [ main, develop, "feature/*" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-verify:
    name: Financial Engine Unit Tests & Benchmarks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab fpdf2 flake8 mypy

      - name: Syntax & Lint Verification
        run: |
          python -m py_compile src/domain/ledger/*.py
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Unit Tests & Benchmark (<500ms limit)
        run: |
          python -m unittest tests/unit/test_double_entry.py -v

  build-pdf-artifact:
    name: Build & Validate Architecture PDF
    runs-on: ubuntu-latest
    needs: test-and-verify

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF Generation Dependencies
        run: |
          python -m pip install reportlab fpdf2

      - name: Generate Product Planning & Architecture PDF
        run: |
          python generate_pdf.py

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PettyFlow-Product-Planning-and-Architecture-PDF
          path: PETTYFLOW_PRODUCT_PLANNING_AND_ARCHITECTURE.pdf
          retention-days: 30
